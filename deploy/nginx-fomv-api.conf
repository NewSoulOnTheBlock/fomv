# FOMV follow server, behind nginx.
#
# nginx terminates TLS and never talks to anything but the loopback, matching
# how the box already fronts its other service. The API must be reachable over
# https rather than by IP: the front end is served from a https origin, and a
# browser refuses a plain-http request from one as mixed content.
#
# Install as /etc/nginx/sites-available/fomv-api, symlink into sites-enabled,
# then run certbot for the same server_name -- it rewrites this file to add the
# 443 block and the certificate lines.

server {
    listen 80;
    listen [::]:80;
    server_name FOMV_API_HOST;

    # Applications carry a name, contacts and a strategy description. Bigger
    # than that is not an application, and the endpoint caps it again itself.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A mirror cycle can hold the loop while Jupiter quotes. These are
        # generous on purpose: a proxy timing out mid-request turns a slow
        # response into a failed one for no benefit.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # CORS is decided by the application, not here. It reads
    # FOMV_ALLOWED_ORIGINS and answers the preflight itself; adding headers at
    # this layer as well would send two of each and browsers reject that.
}
