# FOMV: the site and its API, on one origin.
#
# # Why one vhost and not two
#
# The alternative is the front end on a CDN and the API on a subdomain, which
# is a perfectly good shape and costs a class of problems this one does not
# have: a CORS allow-list to keep in step with wherever the front end is
# deployed this week, a preflight on every write, and a second certificate.
#
# Here the browser only ever talks to one origin. `FOMV_ALLOWED_ORIGINS` can
# stay empty, the preflight never happens, and there is no way to deploy the
# front end somewhere the API has not been told about.
#
# Install as /etc/nginx/sites-available/fomv, symlink into sites-enabled, then
# run certbot for the same server_name.

# www exists only to send people to the apex.
#
# One canonical origin, because two that serve the same thing split every
# incoming link, every cached asset and -- on this product specifically -- the
# origin the API trusts. A permanent redirect is the cheapest way to have the
# name and not have the second site.
server {
    listen 80;
    listen [::]:80;
    server_name www.FOMV_HOST;
    return 301 https://FOMV_HOST$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name FOMV_HOST;

    root /opt/fomv/web;
    index index.html;

    # Applications carry a handle, contacts and a strategy description. The
    # endpoint caps the body again itself; this is the outer bound.
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- the API -----------------------------------------------------------
    #
    # The trailing slash on both sides is what strips the prefix: /api/apply
    # arrives at the application as /apply. Without it the application would
    # see /api/apply and route it to a 404, which is a confusing five minutes
    # the first time.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A mirror cycle can hold the loop while Jupiter quotes. Generous on
        # purpose: a proxy timing out mid-request turns a slow response into a
        # failed one for no benefit.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Nothing from this API is cacheable. It is all per-caller state.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # --- the site ----------------------------------------------------------

    # Vite writes content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The roster and every audit. Regenerated by `build:appdata`, so a long
    # cache would hide a fresh audit for a day; a short one costs nothing.
    location /data/ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        # The app routes on the hash, so every real path is a file that exists
        # and the fallback is only reached by someone typing a path we never
        # served. Sending them the app is friendlier than a bare 404.
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
        # Always revalidated, or a deploy is invisible until the browser feels
        # like checking. It is two kilobytes.
        add_header Cache-Control "no-cache" always;
    }
}
